<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="mariners.css">
    <title>Mariners Live Scoresheet | Troubles Roll By</title>
  </head>
  <body>
    <main>
      <p><a href="/static/games.html">&lt; Games</a> | Seattle Mariners live scoresheet</p>
      <pre id="scoreboard" class="panel" aria-live="polite">Loading Seattle's game...</pre>
      <p class="controls" aria-label="Deterministic scoresheet demonstration">
        Demo: <button id="demo" type="button">Start</button>
        <button id="demo-reset" type="button">Reset</button>
        <button id="demo-step" type="button">Step</button>
        <button id="demo-play" type="button">Play</button>
      </p>

      <div class="columns">
        <section aria-labelledby="field-heading">
          <h1 id="field-heading">Field</h1>
          <svg id="field" class="field-svg" viewBox="0 0 320 320" role="img" aria-label="Live baseball field">
            <path class="outfield" d="M160 278 L30 148 Q160 7 290 148 Z" />
            <path class="foul-lines" d="M160 278 L30 148 M160 278 L290 148" />
            <path class="fence" d="M30 148 Q160 7 290 148" />
            <path class="infield" d="M160 258 L238 180 L160 102 L82 180 Z" />
            <circle class="mound" cx="160" cy="180" r="7" />
            <g class="base"><rect x="154" y="96" width="12" height="12" transform="rotate(45 160 102)" /><rect x="232" y="174" width="12" height="12" transform="rotate(45 238 180)" /><rect x="154" y="252" width="12" height="12" transform="rotate(45 160 258)" /><rect x="76" y="174" width="12" height="12" transform="rotate(45 82 180)" /></g>
            <g class="fielder"><text id="fielder-center" x="160" y="46"></text><text id="fielder-left" x="67" y="100"></text><text id="fielder-right" x="253" y="100"></text><text id="fielder-shortstop" x="116" y="148"></text><text id="fielder-second" x="204" y="148"></text><text id="fielder-third" x="52" y="202"></text><text id="fielder-first" x="268" y="202"></text><text id="fielder-pitcher" x="160" y="171"></text><text id="fielder-catcher" x="160" y="246"></text></g>
            <g class="runner"><text id="runner-second" x="160" y="86"></text><text id="runner-third" x="47" y="171"></text><text id="runner-first" x="273" y="171"></text><text id="batter" x="160" y="307"></text></g>
          </svg>
          <p id="field-note" class="note"></p>
        </section>

        <section aria-labelledby="pitch-heading">
          <div class="heading-row">
            <h1 id="pitch-heading">Pitch-by-pitch</h1>
            <button id="refresh" type="button">Refresh</button>
          </div>
          <p id="message" class="note" aria-live="polite"></p>
          <ol id="pitches" class="panel pitches" aria-live="polite"></ol>
        </section>
      </div>

      <p id="updated" class="note"></p>
      <p class="note">The page checks for updates only while it is visible.</p>
    </main>
    <script src="mariners.js"></script>
  </body>
</html>
