<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="mariners.css">
    <title>Mariners Live Scoresheet | Troubles Roll By</title>
  </head>
  <body>
    <main>
      <p><a href="/static/games.html">&lt; Games</a> | Seattle Mariners live scoresheet</p>
      <pre id="scoreboard" class="panel" aria-live="polite">Loading Seattle's game...</pre>
      <p class="controls" aria-label="Deterministic scoresheet demonstration">
        Demo: <button id="demo" type="button">Start</button>
        <button id="demo-reset" type="button">Reset</button>
        <button id="demo-step" type="button">Step</button>
        <button id="demo-play" type="button">Play</button>
      </p>

      <div class="columns">
        <section aria-labelledby="field-heading">
          <h1 id="field-heading">Field</h1>
          <svg id="field" class="field-svg" viewBox="0 0 320 300" role="img" aria-label="Live baseball field">
            <path class="field-line" d="M160 272 L270 162 L160 52 L50 162 Z M160 272 L160 52 M50 162 L270 162" />
            <path class="field-line faint" d="M50 162 Q160 7 270 162" />
            <g class="base"><rect x="154" y="46" width="12" height="12" /><rect x="264" y="156" width="12" height="12" /><rect x="154" y="266" width="12" height="12" transform="rotate(45 160 272)" /><rect x="44" y="156" width="12" height="12" /></g>
            <g class="fielder"><text id="fielder-center" x="160" y="27"></text><text id="fielder-left" x="48" y="78"></text><text id="fielder-right" x="272" y="78"></text><text id="fielder-shortstop" x="110" y="133"></text><text id="fielder-second" x="210" y="133"></text><text id="fielder-third" x="62" y="184"></text><text id="fielder-first" x="258" y="184"></text><text id="fielder-pitcher" x="160" y="183"></text><text id="fielder-catcher" x="160" y="245"></text></g>
            <g class="runner"><text id="runner-second" x="160" y="39"></text><text id="runner-third" x="23" y="151"></text><text id="runner-first" x="297" y="151"></text><text id="batter" x="160" y="297"></text></g>
          </svg>
          <p id="field-note" class="note"></p>
        </section>

        <section aria-labelledby="pitch-heading">
          <div class="heading-row">
            <h1 id="pitch-heading">Pitch-by-pitch</h1>
            <button id="refresh" type="button">Refresh</button>
          </div>
          <p id="message" class="note" aria-live="polite"></p>
          <ol id="pitches" class="panel pitches" aria-live="polite"></ol>
        </section>
      </div>

      <p id="updated" class="note"></p>
      <p class="note">The page checks for updates only while it is visible.</p>
    </main>
    <script src="mariners.js"></script>
  </body>
</html>
