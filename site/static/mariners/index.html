<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="mariners.css?v=field-3">
    <title>Mariners Live Scoresheet | Troubles Roll By</title>
  </head>
  <body>
    <main>
      <p><a href="/static/games.html">&lt; Games</a> | Seattle Mariners live scoresheet</p>
      <pre id="scoreboard" class="panel" aria-live="polite">Loading Seattle's game...</pre>
      <p class="controls" aria-label="Deterministic scoresheet demonstration">
        Demo: <button id="demo" type="button">Start</button>
        <button id="demo-reset" type="button">Reset</button>
        <button id="demo-step" type="button">Step</button>
        <button id="demo-play" type="button">Play</button>
      </p>

      <div class="columns">
        <section aria-labelledby="field-heading">
          <h1 id="field-heading">Field</h1>
          <svg id="field" class="field-svg" viewBox="0 0 650 500" role="img" aria-label="Live baseball field">
            <!-- Derived from Wikimedia Commons' Baseball diamond simplified SVG; explanatory labels are omitted. -->
            <path class="outfield" d="M150 500 H0 V0 H650 V500 H508 Z" />
            <path class="infield" d="M328.5 439.5 L538.5 229.5 L328.5 19.5 L123.5 224.5 Z" />
            <circle class="mound" cx="328.5" cy="319.5" r="18" />
            <path class="foul-lines" d="M294 405 L0 111 M363 405 L650 118" />
            <path class="base-lines" d="M328.5 439.5 L538.5 229.5 L328.5 19.5 L123.5 224.5 Z" />
            <g class="base"><rect x="321" y="12" width="15" height="15" transform="rotate(45 328.5 19.5)" /><rect x="531" y="222" width="15" height="15" transform="rotate(45 538.5 229.5)" /><rect x="321" y="432" width="15" height="15" transform="rotate(45 328.5 439.5)" /><rect x="116" y="217" width="15" height="15" transform="rotate(45 123.5 224.5)" /></g>
            <g class="fielder"><text id="fielder-center" x="328" y="70"></text><text id="fielder-left" x="116" y="195"></text><text id="fielder-right" x="540" y="195"></text><text id="fielder-shortstop" x="260" y="285"></text><text id="fielder-second" x="396" y="285"></text><text id="fielder-third" x="190" y="350"></text><text id="fielder-first" x="466" y="350"></text><text id="fielder-pitcher" x="328" y="310"></text><text id="fielder-catcher" x="328" y="408"></text></g>
            <g class="runner"><text id="runner-second" x="328" y="178"></text><text id="runner-third" x="174" y="280"></text><text id="runner-first" x="482" y="280"></text><text id="batter" x="328" y="485"></text></g>
          </svg>
          <p id="field-note" class="note"></p>
        </section>

        <section aria-labelledby="pitch-heading">
          <div class="heading-row">
            <h1 id="pitch-heading">Pitch-by-pitch</h1>
            <button id="refresh" type="button">Refresh</button>
          </div>
          <p id="message" class="note" aria-live="polite"></p>
          <ol id="pitches" class="panel pitches" aria-live="polite"></ol>
        </section>
      </div>

      <p id="updated" class="note"></p>
      <p class="note">The page checks for updates only while it is visible.</p>
    </main>
    <script src="mariners.js?v=field-3"></script>
  </body>
</html>
