<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="mariners.css">
    <title>Mariners Live Scoresheet | Troubles Roll By</title>
  </head>
  <body>
    <main>
      <p><a href="/static/games.html">&lt; Games</a> | Seattle Mariners live scoresheet</p>
      <pre id="scoreboard" class="panel" aria-live="polite">Loading Seattle's game...</pre>
      <p class="controls" aria-label="Deterministic scoresheet demonstration">
        Demo: <button id="demo" type="button">Start</button>
        <button id="demo-reset" type="button">Reset</button>
        <button id="demo-step" type="button">Step</button>
        <button id="demo-play" type="button">Play</button>
      </p>

      <div class="columns">
        <section aria-labelledby="field-heading">
          <h1 id="field-heading">Field</h1>
          <svg id="field" class="field-svg" viewBox="0 0 320 360" role="img" aria-label="Live baseball field">
            <path class="outfield" d="M160 322 L9 171 Q160 -4 311 171 Z" />
            <path class="foul-lines" d="M160 322 L9 171 M160 322 L311 171" />
            <path class="fence" d="M9 171 Q160 -4 311 171" />
            <path class="infield" d="M160 302 L250 212 L160 122 L70 212 Z" />
            <circle class="mound" cx="160" cy="212" r="7" />
            <g class="base"><rect x="154" y="116" width="12" height="12" transform="rotate(45 160 122)" /><rect x="244" y="206" width="12" height="12" transform="rotate(45 250 212)" /><rect x="154" y="296" width="12" height="12" transform="rotate(45 160 302)" /><rect x="64" y="206" width="12" height="12" transform="rotate(45 70 212)" /></g>
            <g class="fielder"><text id="fielder-center" x="160" y="38"></text><text id="fielder-left" x="54" y="113"></text><text id="fielder-right" x="266" y="113"></text><text id="fielder-shortstop" x="110" y="174"></text><text id="fielder-second" x="210" y="174"></text><text id="fielder-third" x="43" y="236"></text><text id="fielder-first" x="277" y="236"></text><text id="fielder-pitcher" x="160" y="203"></text><text id="fielder-catcher" x="160" y="290"></text></g>
            <g class="runner"><text id="runner-second" x="160" y="106"></text><text id="runner-third" x="35" y="203"></text><text id="runner-first" x="285" y="203"></text><text id="batter" x="160" y="345"></text></g>
          </svg>
          <p id="field-note" class="note"></p>
        </section>

        <section aria-labelledby="pitch-heading">
          <div class="heading-row">
            <h1 id="pitch-heading">Pitch-by-pitch</h1>
            <button id="refresh" type="button">Refresh</button>
          </div>
          <p id="message" class="note" aria-live="polite"></p>
          <ol id="pitches" class="panel pitches" aria-live="polite"></ol>
        </section>
      </div>

      <p id="updated" class="note"></p>
      <p class="note">The page checks for updates only while it is visible.</p>
    </main>
    <script src="mariners.js?v=field-2"></script>
  </body>
</html>
