<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia</title><link rel="stylesheet" href="trivia.css?v=20260825-2"><style>html,body,#app{height:auto;min-height:100%;overflow:auto}body{background:radial-gradient(circle at 15% 0,#fff9b7 0 13%,transparent 14%),#ffcf4a}#app{min-height:100dvh;background:linear-gradient(155deg,#ffef82,#ffcf4a)}#app[data-screen="question"]{background:linear-gradient(155deg,#ffd6e4,#ff94b8)}#app[data-screen="summary"]{background:linear-gradient(155deg,#c6f8dc,#62df99)}main{height:auto;min-height:100dvh}h1,h2,.person>button{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;letter-spacing:.01em}button,.card,.person{border:3px solid #12283d;box-shadow:4px 4px 0 #12283d}.card{background:#fffdf6}.new-game{position:fixed;top:12px;right:12px;z-index:2;min-height:40px;padding:7px 10px;font-size:14px;background:#ff4f81;color:#12283d;border:3px solid #12283d}.primary{background:#ff4f81;color:#12283d}.category-heading{color:var(--category-color);font-size:clamp(30px,10vw,50px);line-height:.9;text-transform:uppercase;text-shadow:3px 3px 0 #fffdf6,5px 5px 0 #12283d}.category:disabled{background:#abb4be!important;color:#5e6872;box-shadow:inset 0 0 0 3px #7b858e;text-decoration:line-through;opacity:1}.correct{background:#35c66b}.incorrect{background:#fa5b50}.skip{background:#8a62e8}.actions{margin-top:auto}.categories{min-height:calc(100dvh - 11rem)}</style></head>
